<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lumen">
<meta name="theme-color" content="#000000">
<title>Lumen</title>
<style>
:root{
  --bg:#F2F2F7; --stage:#E5E5EA; --bar:rgba(249,249,251,.86); --surface:#FFFFFF; --fill:#E5E5EA; --fill-2:#D1D1D6; --sep:rgba(60,60,67,.18);
  --text:#000; --muted:#6C6C70; --accent:#B86E00; --accent-ink:#fff; --accent-soft:rgba(184,110,0,.14);
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000; --stage:#000; --bar:rgba(22,22,24,.86); --surface:#1C1C1E; --fill:#2C2C2E; --fill-2:#3A3A3C; --sep:rgba(84,84,88,.6);
    --text:#fff; --muted:#8E8E93; --accent:#FFC542; --accent-ink:#1F1600; --accent-soft:rgba(255,197,66,.16); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000; --stage:#000; --bar:rgba(22,22,24,.86); --surface:#1C1C1E; --fill:#2C2C2E; --fill-2:#3A3A3C; --sep:rgba(84,84,88,.6);
  --text:#fff; --muted:#8E8E93; --accent:#FFC542; --accent-ink:#1F1600; --accent-soft:rgba(255,197,66,.16); color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.35;
  -webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;touch-action:manipulation}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block}
 
.app{height:100%;display:flex;flex-direction:column}
 
/* Nav bar */
.nav{flex:none;height:52px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 8px;background:var(--bg)}
.nav .left{justify-self:start}.nav .right{justify-self:end}
.ibtn{width:44px;height:44px;border-radius:22px;display:grid;place-items:center;color:var(--text);transition:opacity .15s,background .15s}
.ibtn svg{width:22px;height:22px}
.ibtn:active:not(:disabled){background:var(--fill)}
.ibtn:disabled{opacity:.3;cursor:default}
.group{display:flex;align-items:center;gap:4px}
.save{height:34px;padding:0 16px;border-radius:17px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:15px;transition:transform .12s}
.save:active{transform:scale(.96)}
.app.is-empty .group,.app.is-empty .save{visibility:hidden}
 
/* Stage */
.stage{flex:1;min-height:0;position:relative;background:var(--stage);overflow:hidden}
#view{position:absolute;top:12px;left:12px;width:calc(100% - 24px);height:calc(100% - 24px);object-fit:contain;touch-action:none;-webkit-touch-callout:none}
.stage.dragover{box-shadow:inset 0 0 0 3px var(--accent)}
.hud{position:absolute;top:16px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:#fff;font-size:13px;font-weight:600;padding:6px 12px;border-radius:14px;opacity:0;transition:opacity .15s;pointer-events:none}
.hud.on{opacity:1}
 
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
.empty .mark{width:84px;height:84px;border-radius:22px;background:conic-gradient(from 210deg at 50% 60%,#FFC542,#FF7A59,#B26BFF,#4FA3FF,#FFC542);display:grid;place-items:center;margin-bottom:8px;box-shadow:0 12px 30px -10px rgba(255,140,80,.5)}
.empty .mark svg{width:40px;height:40px;color:#fff}
.empty h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.02em}
.empty p{margin:0;color:var(--muted);max-width:280px;font-size:16px}
.empty .cta{display:flex;flex-direction:column;gap:10px;width:100%;max-width:300px;margin-top:16px}
.btn-lg{height:50px;border-radius:14px;font-size:17px;font-weight:600;width:100%}
.btn-lg.primary{background:var(--accent);color:var(--accent-ink)}
.btn-lg.secondary{background:var(--fill);color:var(--text)}
.btn-lg:active{opacity:.8}
 
/* Panel */
.panel{flex:none;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep)}
.app.is-empty .panel{display:none}
.head{height:34px;display:flex;align-items:flex-end;justify-content:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.01em}
.head b{color:var(--text);font-variant-numeric:tabular-nums;font-weight:600}
.body{height:150px;display:flex;flex-direction:column;justify-content:center}
.body.tall{height:236px}
.tabbar{height:56px;display:flex;border-top:.5px solid var(--sep)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--muted)}
.tab svg{width:24px;height:24px}
.tab[aria-selected="true"]{color:var(--accent)}
 
.scroller{display:flex;gap:12px;overflow-x:auto;padding:4px 16px;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
.scroller::-webkit-scrollbar{display:none}
 
/* Looks */
.look{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--muted);scroll-snap-align:center}
.look canvas{width:66px;height:66px;border-radius:12px;background:var(--fill);box-shadow:0 0 0 2px transparent;transition:box-shadow .15s}
.look[aria-pressed="true"]{color:var(--text)}
.look[aria-pressed="true"] canvas{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.strength{display:flex;align-items:center;gap:12px;padding:12px 20px 0}
.strength input{flex:1;accent-color:var(--accent);height:28px}
.strength span{font-size:13px;color:var(--muted);font-weight:600}
 
/* Adjust */
.chip{flex:0 0 auto;width:62px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10.5px;font-weight:600;color:var(--muted);scroll-snap-align:center;position:relative}
.chip .ring{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--fill);transition:background .15s,color .15s}
.chip .ring svg{width:20px;height:20px}
.chip[aria-pressed="true"]{color:var(--text)}
.chip[aria-pressed="true"] .ring{background:var(--accent);color:var(--accent-ink)}
.chip.changed:not([aria-pressed="true"]) .ring{box-shadow:inset 0 0 0 2px var(--accent)}
.dial{position:relative;height:44px;margin-top:10px;cursor:ew-resize;touch-action:none;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 25%,#000 75%,transparent);mask-image:linear-gradient(90deg,transparent,#000 25%,#000 75%,transparent)}
.dial:focus-visible{outline:none}
.ticks{position:absolute;inset:10px 0;background-image:linear-gradient(90deg,var(--muted) 0 2px,transparent 2px),linear-gradient(90deg,var(--fill-2) 0 1px,transparent 1px);background-size:75px 100%,15px 55%;background-repeat:repeat-x;background-position-y:center,center}
.fill{position:absolute;top:50%;height:3px;margin-top:-1.5px;background:var(--accent);border-radius:2px}
.needle{position:absolute;left:50%;top:4px;bottom:4px;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--accent)}
 
/* Curves */
.curves{padding:0 16px;display:flex;flex-direction:column;gap:10px}
.cbar{display:flex;align-items:center;gap:8px}
.ch{width:36px;height:30px;border-radius:15px;display:grid;place-items:center;background:var(--fill);font-size:11px;font-weight:700;color:var(--muted)}
.ch i{width:12px;height:12px;border-radius:50%;display:block}
.ch[aria-pressed="true"]{background:var(--fill-2);color:var(--text);box-shadow:inset 0 0 0 1.5px var(--text)}
.cbar .sp{flex:1}
.pill{height:30px;padding:0 12px;border-radius:15px;background:var(--fill);font-size:13px;font-weight:600}
.pill:active{opacity:.7}
.cbox{position:relative;height:170px;border-radius:12px;background:var(--surface);overflow:hidden;touch-action:none}
.cbox svg{position:absolute;inset:0;width:100%;height:100%}
 
/* Crop */
.crop{display:flex;flex-direction:column;gap:14px}
.opt{flex:0 0 auto;height:36px;padding:0 14px;border-radius:18px;background:var(--fill);font-size:14px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:6px;scroll-snap-align:start}
.opt svg{width:18px;height:18px}
.opt[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.opt:active{opacity:.75}
.opt.danger{color:#FF453A}
 
/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:480px;background:var(--surface);border-radius:14px 14px 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .32s cubic-bezier(.32,.72,0,1)}
.scrim.open .sheet{transform:none}
.grab{width:36px;height:5px;border-radius:3px;background:var(--fill-2);margin:0 auto 14px}
.sheet h2{margin:0;font-size:20px;font-weight:700;text-align:center}
.sheet .sub{margin:4px 0 18px;text-align:center;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.field{margin-bottom:16px}
.field>span{display:block;font-size:13px;color:var(--muted);margin:0 4px 6px}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px}
.seg button{flex:1;height:32px;border-radius:7px;font-size:14px;font-weight:600;color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 2px 6px rgba(0,0,0,.15)}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:#636366}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .seg button[aria-pressed="true"]{background:#636366} }
.sheet .btn-lg{margin-top:4px}
 
.toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translate(-50%,-8px);background:rgba(40,40,42,.92);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;font-weight:600;opacity:0;transition:.25s;z-index:30;pointer-events:none;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);opacity:0}
 
@media (min-width: 900px){
  .app{display:grid;grid-template-columns:1fr 380px;grid-template-rows:52px 1fr}
  .nav{grid-column:1 / -1;border-bottom:.5px solid var(--sep)}
  .stage{grid-row:2}
  .panel{grid-row:2;grid-column:2;display:flex;flex-direction:column;border-top:0;border-left:.5px solid var(--sep)}
  .app.is-empty{grid-template-columns:1fr}
  .tabbar{order:-1;border-top:0;border-bottom:.5px solid var(--sep)}
  .head{height:44px}
  .body,.body.tall{height:auto;flex:1;justify-content:flex-start;padding-top:8px}
  .scroller{flex-wrap:wrap}
  .cbox{height:auto;aspect-ratio:1}
  #view{top:32px;left:32px;width:calc(100% - 64px);height:calc(100% - 64px)}
  .scrim{align-items:center}
  .sheet{border-radius:16px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app is-empty" id="app">
  <header class="nav">
    <div class="left"><button class="ibtn" id="openBtn" aria-label="Open photo" title="Open photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="9" cy="9" r="1.8"/><path d="m21 15-4.5-4.5L6 21"/></svg></button></div>
    <div class="group">
      <button class="ibtn" id="undo" aria-label="Undo" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
      <button class="ibtn" id="compare" aria-label="Hold to see original"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M12 4v16"/><path d="M12 4h6a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3h-6z" fill="currentColor" stroke="none" opacity=".4"/></svg></button>
      <button class="ibtn" id="redo" aria-label="Redo" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
    </div>
    <div class="right"><button class="save" id="saveBtn">Save</button></div>
    <input type="file" id="file" accept="image/*" class="sr" tabindex="-1" aria-hidden="true">
  </header>
 
  <main class="stage" id="stage">
    <canvas id="view" hidden></canvas>
    <div class="empty" id="empty">
      <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg></div>
      <h1>Lumen</h1>
      <p>Edit light, color and tone. Your photos stay on your device.</p>
      <div class="cta">
        <button class="btn-lg primary" id="openBtn2">Choose a photo</button>
        <button class="btn-lg secondary" id="sampleBtn">Try a sample</button>
      </div>
    </div>
    <div class="hud" id="hud">Original</div>
  </main>
 
  <section class="panel">
    <div class="head" id="head"></div>
    <div class="body" id="body"></div>
    <nav class="tabbar" role="tablist" aria-label="Tools">
      <button class="tab" role="tab" data-tab="looks" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="9.5" r="5.5"/><circle cx="15" cy="9.5" r="5.5"/><circle cx="12" cy="14.5" r="5.5"/></svg>Looks</button>
      <button class="tab" role="tab" data-tab="adjust" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>Adjust</button>
      <button class="tab" role="tab" data-tab="curves" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M6 18c5 0 7-12 12-12"/></svg>Curves</button>
      <button class="tab" role="tab" data-tab="crop" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/></svg>Crop</button>
    </nav>
  </section>
</div>
 
<div class="scrim" id="scrim">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="grab"></div>
    <h2 id="sheetTitle">Save photo</h2>
    <div class="sub" id="sheetSub"></div>
    <div class="field"><span>Format</span><div class="seg" id="fmtSeg"><button data-v="jpg" aria-pressed="true">JPEG</button><button data-v="png" aria-pressed="false">PNG</button></div></div>
    <div class="field"><span>Size</span><div class="seg" id="sizeSeg"><button data-v="full" aria-pressed="true">Full</button><button data-v="half" aria-pressed="false">Half</button><button data-v="web" aria-pressed="false">Web</button></div></div>
    <button class="btn-lg primary" id="doSave">Save photo</button>
    <button class="btn-lg" id="cancelSave" style="color:var(--accent)">Cancel</button>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
 
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const ICON = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
 
/* ---------- constants (declared before any state) ---------- */
const TOOLS = [
  {k:'exposure',name:'Exposure',min:-100,max:100,icon:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'},
  {k:'contrast',name:'Contrast',min:-100,max:100,icon:'<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/>'},
  {k:'highlights',name:'Highlights',min:-100,max:100,icon:'<circle cx="12" cy="12" r="9"/><path d="M7 9h10M6 13h12M8 17h8"/>'},
  {k:'shadows',name:'Shadows',min:-100,max:100,icon:'<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18" fill="currentColor" opacity=".5"/>'},
  {k:'saturation',name:'Saturation',min:-100,max:100,icon:'<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>'},
  {k:'warmth',name:'Warmth',min:-100,max:100,icon:'<path d="M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0z"/>'},
  {k:'tint',name:'Tint',min:-100,max:100,icon:'<circle cx="8.5" cy="9" r="5"/><circle cx="15.5" cy="9" r="5"/><circle cx="12" cy="15.5" r="5"/>'},
  {k:'fade',name:'Fade',min:0,max:100,icon:'<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 15 15 3M9 21 21 9" opacity=".6"/>'},
  {k:'vignette',name:'Vignette',min:0,max:100,icon:'<rect x="3" y="4" width="18" height="16" rx="3"/><ellipse cx="12" cy="12" rx="5" ry="4"/>'},
  {k:'grain',name:'Grain',min:0,max:100,icon:'<circle cx="7" cy="7" r="1"/><circle cx="12" cy="9" r="1"/><circle cx="17" cy="6" r="1"/><circle cx="8" cy="13" r="1"/><circle cx="15" cy="13" r="1"/><circle cx="11" cy="17" r="1"/><circle cx="17" cy="18" r="1"/><circle cx="6" cy="18" r="1"/>'},
];
const ZERO = Object.fromEntries(TOOLS.map(t => [t.k, 0]));
const PRESETS = [
  {n:'Original',p:{}},
  {n:'Vivid',p:{contrast:20,saturation:38,warmth:6,shadows:12}},
  {n:'Matte',p:{contrast:-12,fade:45,saturation:-15,highlights:-22}},
  {n:'Golden',p:{warmth:42,exposure:8,saturation:12,highlights:-18,vignette:22}},
  {n:'Arctic',p:{warmth:-38,tint:-6,contrast:12,saturation:-12,exposure:6}},
  {n:'Film',p:{fade:26,grain:34,warmth:12,contrast:8,saturation:-8,vignette:26}},
  {n:'Dusk',p:{tint:28,warmth:-12,shadows:22,contrast:14,fade:14}},
  {n:'Noir',p:{saturation:-100,contrast:38,vignette:40,grain:24}},
  {n:'Silver',p:{saturation:-100,contrast:-8,fade:30,highlights:-15,shadows:20}},
];
const LINEAR = () => [[0,0],[1,1]];
const S_CURVE = [[0,0],[.25,.18],[.75,.82],[1,1]];
const CH = {rgb:{c:'var(--text)',l:'RGB'}, r:{c:'#FF453A',l:'Red'}, g:{c:'#30D158',l:'Green'}, b:{c:'#0A84FF',l:'Blue'}};
const ASPECTS = [['orig','Original'],['1:1','Square'],['4:5','4:5'],['3:2','3:2'],['16:9','16:9'],['9:16','Story']];
const PREVIEW_MAX = 1400, EXPORT_MAX = 4096; // iOS caps canvas area at ~16.7 MP
 
/* ---------- curves math ---------- */
function splineFn(pts){
  const n = pts.length, xs = pts.map(p=>p[0]), ys = pts.map(p=>p[1]);
  if (n < 2) return x => x;
  const dx = [], m = [], t = new Array(n);
  for (let i=0;i<n-1;i++){ dx[i] = Math.max(1e-6, xs[i+1]-xs[i]); m[i] = (ys[i+1]-ys[i])/dx[i]; }
  t[0] = m[0]; t[n-1] = m[n-2];
  for (let i=1;i<n-1;i++) t[i] = (m[i-1]*m[i] <= 0) ? 0 : (m[i-1]+m[i])/2;
  for (let i=0;i<n-1;i++){

    p[drag] = [Math.max(lo, Math.min(hi, x)), clamp01(y)];
    if (outside) setHead('Release to remove point', undefined);
    else setHead('Input ' + Math.round(p[drag][0]*255), 'Output ' + Math.round(p[drag][1]*255));
    queueRender(); drawCurve();
  }
  box.addEventListener('pointermove', move);
  const end = () => {
    if (drag < 0) return;
    if (outside) pts().splice(drag, 1);
    drag = -1; outside = false; idle(); queueRender(); commit(); drawCurve();
  };
  box.addEventListener('pointerup', end); box.addEventListener('pointercancel', end);
}
 
/* Crop */
function renderCrop(){
  setHead('Crop & rotate', undefined);
  body.innerHTML = `<div class="crop">
    <div class="scroller">${ASPECTS.map(([v,l]) => `<button class="opt" data-a="${v}" aria-pressed="${state.aspect===v}">${l}</button>`).join('')}</div>
    <div class="scroller">
      <button class="opt" id="rotL">${ICON('<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>')}Rotate</button>
      <button class="opt" id="flip" aria-pressed="${state.flip}">${ICON('<path d="M12 3v18"/><path d="M8 7 3 12l5 5z"/><path d="m16 7 5 5-5 5z"/>')}Flip</button>
      <button class="opt danger" id="resetAll">Revert to original</button>
    </div></div>`;
  body.querySelectorAll('[data-a]').forEach(b => b.onclick = () => { state.aspect = b.dataset.a; geomChanged(); });
  $('#rotL').onclick = () => { state.rot = (state.rot+3) % 4; geomChanged(); };
  $('#flip').onclick = () => { state.flip = !state.flip; geomChanged(); };
  $('#resetAll').onclick = () => { state = freshState(); geomChanged(); toast('Reverted. Tap undo to bring edits back.'); };
}
function geomChanged(){ rebuildGeom(); commit(); renderPanel(); }
 
/* ---------- save ---------- */
let downloads = null;
const opts = {fmt:'jpg', size:'full'};
try { if (window.claude && typeof claude.use === 'function') claude.use('downloads').then(d => { downloads = d; }, () => {}); } catch(e){}
const scrim = $('#scrim');
function bindSeg(id, key){
  const bs = document.querySelectorAll(`#${id} button`);
  bs.forEach(b => b.onclick = () => { opts[key] = b.dataset.v; bs.forEach(x => x.setAttribute('aria-pressed', x === b)); updateSub(); });
}
bindSeg('fmtSeg', 'fmt'); bindSeg('sizeSeg', 'size');
function outLong(){
  const full = Math.min(Math.max(img.naturalWidth || img.width, img.naturalHeight || img.height), EXPORT_MAX);
  return opts.size === 'half' ? Math.round(full/2) : opts.size === 'web' ? Math.min(full, 1600) : full;
}
function updateSub(){
  const g = buildGeom(img, outLong(), state);
  $('#sheetSub').textContent = `${g.width} × ${g.height}`;
}
$('#saveBtn').onclick = () => { if (!img) return; updateSub(); scrim.classList.add('open'); };
const closeSheet = () => scrim.classList.remove('open');
$('#cancelSave').onclick = closeSheet;
scrim.addEventListener('click', e => { if (e.target === scrim) closeSheet(); });
addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
$('#doSave').onclick = async () => {
  const btn = $('#doSave'); btn.disabled = true; btn.textContent = 'Preparing…';
  await new Promise(r => setTimeout(r, 40));
  try {
    const g = buildGeom(img, outLong(), state), x = g.getContext('2d', {willReadFrequently:true});
    const P = effective(state), L = curveLut(state.curves), STRIP = 256;
    for (let y = 0; y < g.height; y += STRIP){
      const h = Math.min(STRIP, g.height - y), d = x.getImageData(0, y, g.width, h);
      process(d, d, g.width, h, P, L, y, g.height); x.putImageData(d, 0, y);
    }
    const blob = await new Promise(r => g.toBlob(r, opts.fmt === 'png' ? 'image/png' : 'image/jpeg', .92));
    g.width = g.height = 1; // free memory on iOS
    if (!blob) throw {code:'too_large'};
    const t = new Date(), pad = n => String(n).padStart(2, '0');
    const filename = `Lumen_${t.getFullYear()}${pad(t.getMonth()+1)}${pad(t.getDate())}_${pad(t.getHours())}${pad(t.getMinutes())}.${opts.fmt}`;
    if (!downloads){ toast('Saving works in the published app, not this preview'); return; }
    await downloads.save({filename, data: blob});
    closeSheet(); toast('Saved');
  } catch (err) {
    const c = err && err.code;
    toast(c === 'declined' ? 'Save cancelled' : c === 'too_large' ? 'Too large to save here. Choose Half or Web.' : c === 'rate_limited' ? 'A save is already in progress' : 'Couldn’t save. Try a smaller size.');
  } finally { btn.disabled = false; btn.textContent = 'Save photo'; }
};
 
let tt; function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2400); }
 
addEventListener('resize', () => { if (img && tab === 'adjust') renderAdjust(); else if (drawCurve) drawCurve(); });
document.addEventListener('gesturestart', e => e.preventDefault());
})();
</script>
</body>
